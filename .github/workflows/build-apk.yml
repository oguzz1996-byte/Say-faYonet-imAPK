
name: Sayfa Yonetim APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SayfaYonetimAndroid_v0.1.0_baslangic.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Projeyi cikar
        run: |
          unzip -q SayfaYonetimAndroid_v0.1.0_baslangic.zip -d source
          test -f source/SayfaYonetimAndroid/settings.gradle.kts

      - name: APK derle
        working-directory: source/SayfaYonetimAndroid
        run: gradle --no-daemon assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Sayfa-Yonetim-APK
          path: source/SayfaYonetimAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
